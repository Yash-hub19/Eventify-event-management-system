<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — Eventify</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-navbar"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">Get started</span>
    <h2>Create your account</h2>
    <p class="muted">Book events or start hosting your own.</p>
    <div id="form-msg"></div>
    <form id="register-form">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" required placeholder="Jane Doe" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
      </div>
      <div class="form-group">
        <label for="role">I want to</label>
        <select id="role">
          <option value="user">Attend events</option>
          <option value="organizer">Host & organize events (requires approval)</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
    </form>
    <p class="center-text" style="margin-top:18px;">Already have an account? <a href="login" style="color:var(--coral-dark);font-weight:700;">Log in</a></p>
  </div>
</div>

<div id="app-footer"></div>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('form-msg');
  msg.innerHTML = '';
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    const data = await api.post('/auth/register', {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      role: document.getElementById('role').value,
    }, { auth: false });
    setToken(data.token);
    setUser(data.user);
    showToast('Account created! Welcome to Eventify.', 'success');
    setTimeout(() => window.location.href = data.user.role === 'organizer' ? 'organizer-dashboard.html' : 'index.html', 600);
  } catch (err) {
    msg.innerHTML = `<div class="form-error">${err.message}</div>`;
    btn.disabled = false; btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
