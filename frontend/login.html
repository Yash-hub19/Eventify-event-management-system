<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Eventify</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-navbar"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">Welcome back</span>
    <h2>Log in to Eventify</h2>
    <div id="form-msg"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Your password" />
      </div>
      <div class="flex-between" style="margin-bottom:18px;">
        <span></span>
        <a href="forgot-password" class="muted" style="font-weight:600;">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
    </form>
    <p class="center-text" style="margin-top:18px;">New to Eventify? <a href="register" style="color:var(--coral-dark);font-weight:700;">Create an account</a></p>
  </div>
</div>

<div id="app-footer"></div>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('form-msg');
  msg.innerHTML = '';
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    const data = await api.post('/auth/login', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    }, { auth: false });
    setToken(data.token);
    setUser(data.user);
    showToast(`Welcome back, ${data.user.name.split(' ')[0]}!`, 'success');
    const redirect = data.user.role === 'admin' ? 'admin-dashboard.html' : data.user.role === 'organizer' ? 'organizer-dashboard.html' : 'index.html';
    setTimeout(() => window.location.href = redirect, 500);
  } catch (err) {
    msg.innerHTML = `<div class="form-error">${err.message}</div>`;
    btn.disabled = false; btn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
