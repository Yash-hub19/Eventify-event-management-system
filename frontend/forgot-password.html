<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password — Eventify</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-navbar"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">Reset access</span>
    <h2>Forgot your password?</h2>
    <p class="muted">Enter your email and we'll send you a reset link.</p>
    <div id="form-msg"></div>
    <form id="forgot-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Send reset link</button>
    </form>
    <p class="center-text" style="margin-top:18px;"><a href="login" style="color:var(--coral-dark);font-weight:700;">Back to log in</a></p>
  </div>
</div>
<div id="app-footer"></div>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout.js"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('form-msg');
  msg.innerHTML = '';
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    const data = await api.post('/auth/forgot-password', { email: document.getElementById('email').value }, { auth: false });
    let extra = '';
    if (data.devResetUrl) {
      extra = `<br/><br/><strong>Dev mode</strong> (no SMTP configured) — <a href="${data.devResetUrl}">Click here to reset</a>`;
    }
    msg.innerHTML = `<div class="form-success">${data.message}${extra}</div>`;
    btn.disabled = false; btn.textContent = 'Send reset link';
  } catch (err) {
    msg.innerHTML = `<div class="form-error">${err.message}</div>`;
    btn.disabled = false; btn.textContent = 'Send reset link';
  }
});
</script>
</body>
</html>
