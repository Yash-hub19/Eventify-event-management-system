<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — Eventify</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-navbar"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">Almost there</span>
    <h2>Set a new password</h2>
    <div id="form-msg"></div>
    <form id="reset-form">
      <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
      </div>
      <div class="form-group">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" required minlength="6" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Reset password</button>
    </form>
  </div>
</div>
<div id="app-footer"></div>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const email = params.get('email');

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('form-msg');
  msg.innerHTML = '';
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  if (password !== confirm) {
    msg.innerHTML = `<div class="form-error">Passwords do not match</div>`;
    return;
  }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Resetting...';
  try {
    const data = await api.post('/auth/reset-password', { email, token, password }, { auth: false });
    msg.innerHTML = `<div class="form-success">${data.message}</div>`;
    setTimeout(() => window.location.href = 'login.html', 1500);
  } catch (err) {
    msg.innerHTML = `<div class="form-error">${err.message}</div>`;
    btn.disabled = false; btn.textContent = 'Reset password';
  }
});
</script>
</body>
</html>
