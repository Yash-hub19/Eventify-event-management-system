<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Become an Organizer — Eventify</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-navbar"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">Host with us</span>
    <h2>Become an organizer</h2>
    <p class="muted">Get access to the organizer dashboard: create events, manage bookings, track revenue, and message attendees. Requests are reviewed by an admin.</p>
    <div id="form-msg"></div>
    <button class="btn btn-primary btn-block" id="request-btn">Request organizer access</button>
  </div>
</div>
<div id="app-footer"></div>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout.js"></script>
<script>
document.getElementById('request-btn').addEventListener('click', async () => {
  if (!isLoggedIn()) { window.location.href = 'login.html'; return; }
  const msg = document.getElementById('form-msg');
  try {
    const data = await api.post('/users/request-organizer', {});
    msg.innerHTML = `<div class="form-success">${data.message}</div>`;
    showToast('Request submitted', 'success');
  } catch (err) {
    msg.innerHTML = `<div class="form-error">${err.message}</div>`;
  }
});
</script>
</body>
</html>
